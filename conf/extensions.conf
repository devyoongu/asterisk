; AI 콜봇 (로컬 Mac에서 2001로 SIP 등록)
;
; JITTERBUFFER(adaptive)=<max_size>[,<resync_threshold>,<impl>]
; - 인바운드 채널(발신측: 1003 web-rtc / 1001 Zoiper) 에 적응형 jitter buffer
;   를 부착해 burst/지연 RTP 를 200ms 윈도우로 평탄화 후 callbot 으로 전달.
; - WebRTC 클라이언트의 RTP 가 burst 로 도착해 callbot 측 STT 가 leading
;   silence padding 후 음소를 잘못 매칭하던 문제(audio_source 의 silence
;   skip 만으로는 미결) 를 chan_pjsip 차원에서 해결.
; - Zoiper 발신은 jitter 가 거의 없어 영향 미미.
exten => 2001,1,Set(JITTERBUFFER(adaptive)=200)
 same => n,Dial(PJSIP/2001,30)
 same => n,Hangup()