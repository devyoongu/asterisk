;
; [JITTERBUFFER 가설 검증용 임시 변경]
; 이전: Set(JITTERBUFFER(adaptive)=200) — TTS ON 시 callbot 의 outbound TTS RTP
;   가 inbound 측 packet 도달 jitter 를 키워 adaptive buffer 가 확장 → browser
;   audio 가 hold-and-release 되어 일부 turn 의 1st STT 가 0 audio (T2,T4 retry).
; 검증: JITTERBUFFER 제거 후 5-FAQ 재테스트 → retry 0 회면 가설 확정.
; (제거 시 burst 문제 재발 가능성 있어 가설 검증 후 fixed=60 등으로 보정 예정.)
exten => 2001,1,Dial(PJSIP/2001,30)
 same => n,Hangup()