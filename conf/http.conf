; Asterisk 내장 HTTP 서버 설정.
; res_pjsip 의 [transport-ws] (pjsip.conf) 가 이 위에서 동작하므로,
; WebRTC 브라우저 클라이언트(1003) 가 붙으려면 이 서버가 켜져 있어야 한다.
; 켜진 상태 확인: asterisk -rx "http show status"  →  "Server Enabled and Bound to 0.0.0.0:8088"

[general]
enabled=yes
; 브라우저는 외부에서 들어오므로 0.0.0.0. 127.0.0.1 로 두면 외부 WS 가 모두 거부됨.
bindaddr=0.0.0.0
bindport=8088
