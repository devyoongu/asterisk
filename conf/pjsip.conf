[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ── WebSocket 트랜스포트 (브라우저 SIP 클라이언트용) ──────────
; http.conf 의 enabled=yes / bindaddr=0.0.0.0 / bindport=8088 필요.
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

[1001]
type=endpoint
transport=transport-udp
context=internal
disallow=all
allow=ulaw,alaw,g722
auth=auth1001
aors=1001

[auth1001]
type=auth
auth_type=userpass
username=1001
password=secret1001

[1001]
type=aor
max_contacts=1
remove_existing=yes

[1002]
type=endpoint
transport=transport-udp
context=internal
disallow=all
allow=ulaw,alaw,g722
auth=auth1002
aors=1002

[auth1002]
type=auth
auth_type=userpass
username=1002
password=secret1002

[1002]
type=aor
max_contacts=1
remove_existing=yes

; ── AI 콜봇 내선 2001 ──────────────────────────────────────
[2001]
type=endpoint
transport=transport-udp
context=internal
disallow=all
allow=ulaw,alaw
auth=auth2001
aors=2001
; RTP를 항상 Asterisk가 중계 (콜봇이 다른 서브넷/VPN에 있으므로 direct media 불가)
direct_media=no
; force_rport/rewrite_contact: SIP Contact 주소 보정 (NAT/VPN 환경)
force_rport=yes
rewrite_contact=yes
; rtp_symmetric=no (기본값 유지): pyVoIP는 sin/sout 소켓을 분리해서 사용하므로
; rtp_symmetric=yes 시 sout의 임의 포트로 응답 → sin(16027)에 미도달

[auth2001]
type=auth
auth_type=userpass
username=2001
password=secret2001

[2001]
type=aor
max_contacts=1
remove_existing=yes

; ── WebRTC 브라우저 엔드포인트 1003 ───────────────────────
; webrtc=yes 한 줄로 ice_support / dtls_* / rtcp_mux / use_avpf 자동 활성.
; MVP: 자체 DTLS 키페어 미지정 — Asterisk 임시 인증서 사용. 운영 시 dtls_cert_file 명시.
;
; 코덱: ulaw 만 허용. 콜봇(2001) 이 ulaw/alaw 만 지원하는데
; opus 를 같이 두면 SDP 협상에서 opus 가 선택되고, Asterisk 에 codec_opus.so
; 가 없으면 브리지 단계에서 "No path to translate (opus) -> (ulaw)" 로
; 통화 직후 끊긴다. 동일 코덱으로 통일해 트랜스코딩 자체를 회피.
[1003]
type=endpoint
transport=transport-ws
context=internal
disallow=all
allow=ulaw
auth=auth1003
aors=1003
webrtc=yes
direct_media=no
force_rport=yes
rewrite_contact=yes

[auth1003]
type=auth
auth_type=userpass
username=1003
password=secret1003

[1003]
type=aor
max_contacts=1
remove_existing=yes